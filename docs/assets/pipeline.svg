<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="protopath pipeline: capture, reassembly, framing, field model, checksum search, recovered CRC, value semantics, conversation grammar, family label, generated artifacts">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .box-accent { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
      .title { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0d1117; }
      .sub { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #57606a; }
      .note { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
      .link { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .row { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 0.08em; }
    </style>
  </defs>

  <text x="20" y="28" class="note">one direction of one conversation, top to bottom</text>

  <text x="20" y="58" class="row">ACQUIRE</text>

  <rect class="box" x="20" y="68" width="210" height="78" rx="8"/>
  <text class="title" x="125" y="98" text-anchor="middle">capture</text>
  <text class="sub" x="125" y="119" text-anchor="middle">pcap · pcapng</text>
  <text class="sub" x="125" y="136" text-anchor="middle">eth · ipv4 · ipv6 · sll</text>

  <path class="link" d="M 234 107 L 262 107" marker-end="url(#arrow)"/>

  <rect class="box" x="270" y="68" width="210" height="78" rx="8"/>
  <text class="title" x="375" y="98" text-anchor="middle">reassembly</text>
  <text class="sub" x="375" y="119" text-anchor="middle">tcp sequence order</text>
  <text class="sub" x="375" y="136" text-anchor="middle">retransmits · gaps</text>

  <path class="link" d="M 484 107 L 512 107" marker-end="url(#arrow)"/>

  <rect class="box-accent" x="520" y="68" width="210" height="78" rx="8"/>
  <text class="title" x="625" y="98" text-anchor="middle">framing</text>
  <text class="sub" x="625" y="119" text-anchor="middle">5 families ranked</text>
  <text class="sub" x="625" y="136" text-anchor="middle">stream consumed exactly</text>

  <path class="link" d="M 734 107 L 762 107" marker-end="url(#arrow)"/>

  <rect class="box" x="770" y="68" width="210" height="78" rx="8"/>
  <text class="title" x="875" y="98" text-anchor="middle">field model</text>
  <text class="sub" x="875" y="119" text-anchor="middle">offset · role · width</text>
  <text class="sub" x="875" y="136" text-anchor="middle">confidence · evidence</text>

  <path class="link" d="M 125 146 L 125 178" marker-end="url(#arrow)"/>
  <path class="link" d="M 625 146 L 625 178" marker-end="url(#arrow)"/>

  <text x="20" y="196" class="row">INTERPRET</text>

  <rect class="box" x="20" y="206" width="210" height="78" rx="8"/>
  <text class="title" x="125" y="236" text-anchor="middle">checksum catalogue</text>
  <text class="sub" x="125" y="257" text-anchor="middle">26 algorithms</text>
  <text class="sub" x="125" y="274" text-anchor="middle">every message or no</text>

  <path class="link" d="M 234 245 L 262 245" marker-end="url(#arrow)"/>

  <rect class="box-accent" x="270" y="206" width="210" height="78" rx="8"/>
  <text class="title" x="375" y="236" text-anchor="middle">crc recovery</text>
  <text class="sub" x="375" y="257" text-anchor="middle">solve poly · init · xorout</text>
  <text class="sub" x="375" y="274" text-anchor="middle">nothing matched? derive it</text>

  <path class="link" d="M 484 245 L 512 245" marker-end="url(#arrow)"/>

  <rect class="box" x="520" y="206" width="210" height="78" rx="8"/>
  <text class="title" x="625" y="236" text-anchor="middle">value semantics</text>
  <text class="sub" x="625" y="257" text-anchor="middle">counter · enum · flags</text>
  <text class="sub" x="625" y="274" text-anchor="middle">text vocabulary · record</text>

  <path class="link" d="M 734 245 L 762 245" marker-end="url(#arrow)"/>

  <rect class="box" x="770" y="206" width="210" height="78" rx="8"/>
  <text class="title" x="875" y="236" text-anchor="middle">grammar</text>
  <text class="sub" x="875" y="257" text-anchor="middle">request → response</text>
  <text class="sub" x="875" y="274" text-anchor="middle">latency · handshake</text>

  <path class="link" d="M 875 284 L 875 316" marker-end="url(#arrow)"/>

  <text x="20" y="334" class="row">IDENTIFY</text>

  <rect class="box" x="20" y="344" width="460" height="62" rx="8"/>
  <text class="title" x="250" y="370" text-anchor="middle">family label — "consistent with", never "is"</text>
  <text class="sub" x="250" y="391" text-anchor="middle">modbus · mqtt · dnp3 · snmp · tls · http · sip · resp …</text>

  <path class="link" d="M 484 375 L 512 375" marker-end="url(#arrow)"/>

  <rect class="box" x="520" y="344" width="460" height="62" rx="8"/>
  <text class="title" x="750" y="370" text-anchor="middle">artifacts</text>
  <text class="sub" x="750" y="391" text-anchor="middle">dissector.lua · client.ts · client.py · fuzz.py · report.md · analysis.json</text>

  <text x="20" y="426" class="note">no confident framing? exit 3, and the report names the hypothesis that survived instead</text>
</svg>
